services:
  powerchampion-marketplace:
    build:
      context: .
      dockerfile: Dockerfile
    image: powerchampion-marketplace:latest
    container_name: powerchampion-marketplace
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Server-side origin of the b300 gateway, consumed by /status and
      # /api/balance. Unset keeps the public hostname
      # https://b300.powerchampion.ai (the app's built-in fallback); set
      # GATEWAY_ORIGIN in the Dokploy environment (or a .env file) to point a
      # stage or prod deployment at a different gateway without rebuilding.
      GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:-https://b300.powerchampion.ai}
      # TLS ends at Traefik, so without this vinext rebuilds request.url as
      # http://. Same-origin checks (/api/playground, /api/chat, /api/portal)
      # would then reject every browser request, and lib/seo.ts would mark
      # every page noindex. Safe only because this container publishes no
      # ports and is reached exclusively through Traefik.
      VINEXT_TRUST_PROXY: "1"
    networks:
      - dokploy-network
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.powerchampion-marketplace-web.entrypoints: web
      traefik.http.routers.powerchampion-marketplace-web.rule: Host(`powerchampion.ai`)
      traefik.http.routers.powerchampion-marketplace-web.middlewares: redirect-to-https@file
      traefik.http.routers.powerchampion-marketplace-web.service: powerchampion-marketplace-web
      traefik.http.services.powerchampion-marketplace-web.loadbalancer.server.port: "3000"
      traefik.http.routers.powerchampion-marketplace-websecure.entrypoints: websecure
      traefik.http.routers.powerchampion-marketplace-websecure.rule: Host(`powerchampion.ai`)
      traefik.http.routers.powerchampion-marketplace-websecure.tls.certresolver: letsencrypt
      traefik.http.routers.powerchampion-marketplace-websecure.service: powerchampion-marketplace-websecure
      traefik.http.services.powerchampion-marketplace-websecure.loadbalancer.server.port: "3000"
networks:
  dokploy-network:
    external: true
