services:
  powerchampion-marketplace:
    build:
      context: .
      dockerfile: Dockerfile
    image: powerchampion-marketplace:latest
    container_name: powerchampion-marketplace
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Server-side origin of the b300 gateway, consumed by /status and
      # /api/balance. Unset keeps the public hostname
      # https://b300.powerchampion.ai (the app's built-in fallback); set
      # GATEWAY_ORIGIN in the Dokploy environment (or a .env file) to point a
      # stage or prod deployment at a different gateway without rebuilding.
      GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:-https://b300.powerchampion.ai}
      # TLS ends at Traefik, so without this vinext rebuilds request.url as
      # http://. Same-origin checks (/api/playground, /api/chat, /api/portal)
      # would then reject every browser request, and lib/seo.ts would mark
      # every page noindex. Safe only because this container publishes no
      # ports and is reached exclusively through Traefik.
      VINEXT_TRUST_PROXY: "1"
      # Customer/admin service below, reachable only on this Compose network.
      # The BFF accepts cleartext solely for a single-label service name.
      PC_PORTAL_ORIGIN: http://powerchampion-portal:3020
      # Google Search Console token. Paste it into the Dokploy environment to
      # publish the verification meta tag; empty or malformed values render
      # nothing, so no code change is needed to verify the domain.
      SITE_VERIFICATION: ${SITE_VERIFICATION:-}
      # Cloudflare Web Analytics site token. Empty keeps the beacon off; when
      # set, it loads on public pages only (never on account, admin, sign-in,
      # registration, or preview origins). No cookie, no cross-site identifier.
      WEB_ANALYTICS_TOKEN: ${WEB_ANALYTICS_TOKEN:-}
    networks:
      - dokploy-network
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.powerchampion-marketplace-web.entrypoints: web
      traefik.http.routers.powerchampion-marketplace-web.rule: Host(`powerchampion.ai`)
      traefik.http.routers.powerchampion-marketplace-web.middlewares: redirect-to-https@file
      traefik.http.routers.powerchampion-marketplace-web.service: powerchampion-marketplace-web
      traefik.http.services.powerchampion-marketplace-web.loadbalancer.server.port: "3000"
      traefik.http.routers.powerchampion-marketplace-websecure.entrypoints: websecure
      traefik.http.routers.powerchampion-marketplace-websecure.rule: Host(`powerchampion.ai`)
      traefik.http.routers.powerchampion-marketplace-websecure.tls.certresolver: letsencrypt
      traefik.http.routers.powerchampion-marketplace-websecure.service: powerchampion-marketplace-websecure
      traefik.http.services.powerchampion-marketplace-websecure.loadbalancer.server.port: "3000"

  powerchampion-portal:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: powerchampion-portal:latest
    container_name: powerchampion-portal
    restart: unless-stopped
    environment:
      PC_PORTAL_ENV: production
      PC_PORTAL_SECURE_COOKIES: "1"
      PC_PORTAL_ALLOWED_ORIGINS: https://powerchampion.ai
      PC_PORTAL_DB: /data/portal.sqlite3
      PC_GATEWAY_ORIGIN: https://b300.powerchampion.ai
      # Key self-service stays disconnected on purpose: PC_GATEWAY_ADMIN_TOKEN is
      # not passed. Gateway keys created without a prepaid balance are post-paid
      # with no spend cap, so connect it only together with prepaid enforcement.
      # The anonymous chat trial stays off (no PC_TRIAL_API_KEY either).
      PC_TRIAL_ENABLED: "0"
    volumes:
      - portal-data:/data
    # No ports, no Traefik labels and not on dokploy-network: only the website
    # container can reach this service.
    networks:
      - default

volumes:
  portal-data:

networks:
  dokploy-network:
    external: true
